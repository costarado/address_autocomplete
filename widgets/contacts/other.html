<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Find Other Address</title>

  <style>
    body { font-family: Arial, sans-serif; padding: 10px; }
    input { width: 100%; padding: 6px; margin-bottom: 8px; box-sizing: border-box; }
    button { padding: 8px 12px; cursor: pointer; }
    #msg { white-space: pre-wrap; margin-top: 10px; font-size: 13px; }
  </style>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDAL5Dl_ZM0vyNkrn1fFw3b6Jhzek_MZxU&libraries=places&language=he"
    async defer>
  </script>
</head>

<body>
  <h3>Find Other Address</h3>

  <input id="search" placeholder="Search address (Google)" />
  <input id="street" placeholder="Street" />
  <input id="house" placeholder="House" />
  <input id="city" placeholder="City" />
  <input id="zip" placeholder="Zip" />

  <button id="save">Save to Zoho</button>
  <div id="msg"></div>

  <script>
    const qs = new URLSearchParams(location.search);
    const recordId = qs.get("record_id") || "";
    const msg = document.getElementById("msg");
    const saveBtn = document.getElementById("save");

    function setMsg(t) {
      msg.textContent = t || "";
    }

    if (!recordId) {
      setMsg("ERROR: missing record_id in URL.\nFix Zoho button to pass ${Contacts.Id} / record id macro.");
      saveBtn.disabled = true;
    }

    let autocomplete = null;

    function initAutocomplete() {
      if (!window.google || !google.maps || !google.maps.places) return;

      autocomplete = new google.maps.places.Autocomplete(
        document.getElementById("search"),
        { types: ["address"], componentRestrictions: { country: "il" } }
      );

      autocomplete.addListener("place_changed", () => {
        const place = autocomplete.getPlace();
        if (!place || !place.address_components) return;

        let street = "", house = "", city = "", zip = "";

        place.address_components.forEach((c) => {
          if (c.types.includes("route")) street = c.long_name;
          if (c.types.includes("street_number")) house = c.long_name;
          if (c.types.includes("locality")) city = c.long_name;
          if (c.types.includes("postal_code")) zip = c.long_name;
        });

        document.getElementById("street").value = street;
        document.getElementById("house").value = house;
        document.getElementById("city").value = city;
        document.getElementById("zip").value = zip;
        setMsg("");
      });
    }

    window.addEventListener("load", () => {
      const wait = setInterval(() => {
        if (window.google && google.maps && google.maps.places) {
          clearInterval(wait);
          initAutocomplete();
        }
      }, 100);
    });

    saveBtn.addEventListener("click", async () => {
      if (!recordId) return;

      const payload = {
        street: document.getElementById("street").value.trim(),
        house: document.getElementById("house").value.trim(),
        city: document.getElementById("city").value.trim(),
        zip: document.getElementById("zip").value.trim(),
      };

      if (!payload.street && !payload.city) {
        setMsg("Select address from Google suggestions first.");
        return;
      }

      try {
        saveBtn.disabled = true;
        setMsg("Saving...");

        const resp = await fetch("/.netlify/functions/send-to-zoho", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            recordId,
            addressType: "other",
            payload,
          }),
        });

        const json = await resp.json().catch(() => ({}));
        if (!resp.ok) {
          setMsg("ERROR saving to Zoho:\n" + JSON.stringify(json, null, 2));
          saveBtn.disabled = false;
          return;
        }

        setMsg("Saved ✅\n" + JSON.stringify(json, null, 2));
        saveBtn.disabled = false;
      } catch (e) {
        setMsg("Client error: " + String(e));
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
